name: registrar-previsoes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  chamar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Chamar a rota de registro
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --fail-with-body --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://futebol-estatisticas.vercel.app/api/cron/registrar
